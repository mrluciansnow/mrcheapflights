# Manual deploy of the site and the multiplayer API to Cloudflare Pages.
#
# Deliberately workflow_dispatch only: nothing here should fire on a push.
# A deploy is a production event and stays a decision someone makes on purpose.
#
# Requires two repository secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   — token with "Cloudflare Pages: Edit" and "D1: Edit"
#   CLOUDFLARE_ACCOUNT_ID  — the account id from the Cloudflare dashboard URL
name: Deploy

on:
  workflow_dispatch:
    inputs:
      migrate:
        description: 'Apply the multiplayer schema to production D1 before deploying'
        type: boolean
        default: true
      branch:
        description: 'Pages branch to deploy as — use the Pages production branch for a live deploy'
        type: string
        default: main
      url:
        description: 'Site URL to health-check after deploying, e.g. https://mrcheapflights.com (blank to skip)'
        type: string
        default: ''

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install wrangler
        run: npm ci

      # Show what the runner intends to do before it touches production. On a
      # database that already has the schema this should read "adopted" for
      # everything up to the last deploy and "applying" only for what is new.
      - name: Plan the migration
        if: ${{ inputs.migrate }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node tools/migrate.mjs --remote --dry

      # One command for every migration, in order, exactly once each. It
      # records what it applies in cf_migrations and adopts anything already
      # present, so it is correct on a fresh database and on the live one.
      - name: Migrate production D1
        if: ${{ inputs.migrate }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node tools/migrate.mjs --remote

      - name: Deploy to Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        id: pages
        run: npx wrangler pages deploy . --branch="${{ inputs.branch }}" --commit-dirty=true

      # The deploy is not finished until the online half can actually serve.
      # /api/mp/health answers the three things that go wrong — binding,
      # migrations, wrong database — and fails this job if any of them is off.
      - name: Check the online half is serving
        if: ${{ inputs.url != '' }}
        run: |
          set -e
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /tmp/health.json -w '%{http_code}' "${{ inputs.url }}/api/mp/health" || true)
            echo "attempt $i -> HTTP $code"
            cat /tmp/health.json || true; echo
            if [ "$code" = "200" ]; then echo "online is ready to serve"; exit 0; fi
            sleep 10
          done
          echo "::error::/api/mp/health did not return 200 — the site deployed but online will not work"
          exit 1
