# Manual deploy of the site and the multiplayer API to Cloudflare Pages.
#
# Deliberately workflow_dispatch only: nothing here should fire on a push.
# A deploy is a production event and stays a decision someone makes on purpose.
#
# Requires two repository secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   — token with "Cloudflare Pages: Edit" and "D1: Edit"
#   CLOUDFLARE_ACCOUNT_ID  — the account id from the Cloudflare dashboard URL
name: Deploy

on:
  workflow_dispatch:
    inputs:
      migrate:
        description: 'Apply the multiplayer schema to production D1 before deploying'
        type: boolean
        default: true
      branch:
        description: 'Pages branch to deploy as — use the Pages production branch for a live deploy'
        type: string
        default: main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install wrangler
        run: npm ci

      # Every statement in 0006 is CREATE ... IF NOT EXISTS, so re-running this
      # against a database that already has the tables is a no-op.
      - name: Apply multiplayer schema to production D1
        if: ${{ inputs.migrate }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute mrcheapflights-prod --remote --yes --file=migrations/0006_multiplayer.sql

      - name: Verify the multiplayer tables exist
        if: ${{ inputs.migrate }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 execute mrcheapflights-prod --remote --yes \
            --command "SELECT name FROM sqlite_master WHERE type='table' AND name LIKE 'cf_%' ORDER BY name"

      - name: Deploy to Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy . --branch="${{ inputs.branch }}" --commit-dirty=true
